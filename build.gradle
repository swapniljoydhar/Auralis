buildscript {
    ext {
        agp_version = '8.7.3'
        kotlin_version = '2.0.21'
        kotlin_coroutines_version = '1.9.0'
        navigation_version = '2.8.5'
        hilt_version = '2.52'
        room_version = '2.8.4'
        core_version = '1.15.0'
        desugaring_version = '2.1.3'

        min_sdk = 24
        target_sdk = 35
    }

    dependencies {
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
    }
}

plugins {
    id "com.android.application" version "$agp_version" apply false
    id "org.jetbrains.kotlin.android" version "$kotlin_version" apply false
    id "androidx.navigation.safeargs.kotlin" version "$navigation_version" apply false
    id 'com.android.library' version "$agp_version" apply false
    id "org.jetbrains.kotlin.plugin.parcelize" version "$kotlin_version" apply false
    id "com.google.devtools.ksp" version "$kotlin_version-1.0.28" apply false
    id "com.diffplug.spotless" version "6.25.0" apply true
}

spotless {
    kotlin {
        target "*/src/**/*.kt"
        ktfmt().kotlinlangStyle()
        licenseHeaderFile("NOTICE")
    }
}
